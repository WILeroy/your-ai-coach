# FIT · AI 体能教练 nginx 反向代理
# 端口策略:
#   - 5210: gunicorn 仅本机回环(公网不可达)
#   - 5200: HTTPS 对外(云安全组已放行的旧端口，无需控制台改动)
#   - 80/443: 标准入口；若安全组/域名后续放行可直接使用
# 证书由 deploy/setup-https.sh 生成；绑定域名后: sudo certbot --nginx -d 你的域名

upstream fit_app {
    server 127.0.0.1:5210;
    keepalive 16;
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    # 443: 标准HTTPS(安全组放行后生效)
    listen 443 ssl;
    # 5200: 当前公网入口(复用已放行端口，仍强制TLS)
    listen 5200 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fit-ai-coach.crt;
    ssl_certificate_key /etc/nginx/ssl/fit-ai-coach.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:5m;

    client_max_body_size 2m;

    location / {
        proxy_pass http://fit_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # SSE: 关闭缓冲，保持长连接心跳可穿透
        proxy_buffering           off;
        proxy_cache               off;
        proxy_read_timeout        300s;
        proxy_send_timeout        300s;
        chunked_transfer_encoding off;
    }
}
